      url: https://drive.google.com/drive/folders/1waCTQsIbfyZi0F80LlnWeerPcoNlPnw1

principles:
  - one_canonical_content_pipeline
  - narrative_design_precedes_scene_dialogue
  - locked_scene_precedes_visual_planning
  - cg_manifest_is_renderer_boundary
  - render_prompt_is_deterministic_projection
  - adapters_change_transport_not_creative_content
  - harness_logic_is_separate_from_content_data
  - repository_current_state_beats_conversation_memory
  - bounded_context_only
  - one_worker_one_task
  - explicit_handoff
  - no_implicit_cross_character_memory
  - one_independent_image_per_generation_call
  - source_acquisition_is_fail_closed
  - no_automatic_retry_or_image_scoring

pipeline:
  - layer: narrative_design
    harness: content_writer
    pass: narrative_design
    output: narrative_continuity_contract
  - layer: scene_dialogue
    harness: content_writer
    pass: scene_dialogue
    requires: approved_narrative_continuity_contract
    output: locked_scene
  - layer: narrative_review
    harness: content_qa
    pass: narrative_review
    output: approved_locked_scene
  - layer: visual_production
    harness: cg_planner
    requires: approved_locked_scene
    output: canonical_cg_manifest
  - layer: render
    harness: cg_renderer
    requires: canonical_cg_manifest_entry_and_declared_references
    output: cg_candidate
  - layer: visual_review
    harness: content_qa
    pass: visual_review
    output: accepted_or_rejected_candidate
  - layer: integration
    harness: integrator
    requires: accepted_content_and_assets
    output: playable_content

source_authority:
  policy: .ai/policies/SOURCE_AUTHORITY.md
  context_isolation: .ai/policies/CONTEXT_ISOLATION.md
  inventory: docs/CONTENT_PRODUCTION_SOURCE_MAP.md
  current_state: PROJECT_STATE.md
  narrative_canon:
    - docs/narrative/PROTOTYPE_BRAIDED_NARRATIVE_SPEC.md
    - docs/narrative/PROTOTYPE_ROUTE_GRAPH_AND_STATE.md
    - docs/narrative/scenes/vertical-slice/
  visual_canon:
    - docs/art/PRODUCTION_VISUAL_DIRECTION.md
    - docs/art/CHARACTER_REFERENCE_PACK_SPEC.md
  runtime_architecture:
    - ARCHITECTURE.zh-TW.md
    - docs/W4_PLAYER_UI_MEMORIES_GALLERY_SPEC.md
  forbidden_source_roots:
    - .ai/archive/
    - .ai/experiments/
    - docs/archive/
  runtime_fixtures_not_production_guidance:
    - runtime-public/sprites/
    - assets-src/characters/
    - content/routes/xu-tang/

harnesses:
  content_writer:
    path: .ai/harnesses/content-writer.md
    passes: [narrative_design, scene_dialogue]
  cg_planner:
    path: .ai/harnesses/cg-planner.md
    output: canonical_cg_manifest
  cg_renderer:
    path: .ai/harnesses/cg-renderer.md
    input_boundary: cg_manifest_entry_plus_references
  content_qa:
    path: .ai/harnesses/content-qa.md
    passes: [narrative_review, visual_review]
  integrator:
    path: .ai/harnesses/integrator.md
    input_boundary: accepted_outputs_only

schemas:
  task_packet: .ai/schemas/TASK_PACKET.md
  data_packs: .ai/schemas/DATA_PACKS.md
  handoff: .ai/schemas/HANDOFF.md

execution:
  default_unit: one_task
  default_agent_state: fresh
  worker_may_expand_scope: false
  worker_may_change_canon: false
  render_generation_unit: one_manifest_entry
  human_gates:
    - major_story_direction
    - canonical_character_design
    - base_cg_reference_attachment
    - accepted_master_image_selection
    - final_playable_acceptance
