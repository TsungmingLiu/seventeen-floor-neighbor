workflow:
  id: seventeen-floor-production
  version: 1.2.0
  updated: 2026-09-26
  entrypoint: .ai/harnesses/bootstrap.md
  repository:
    full_name: TsungmingLiu/seventeen-floor-neighbor
    url: https://github.com/TsungmingLiu/seventeen-floor-neighbor
    canonical_branch: main
  reference_resolution:
    provider: repo_file
    catalog: content/assets/source-catalog.json
    rule: Resolve source IDs only through source_catalog.files[sourceId].sourcePath; verify exact role, filename, MIME, SHA-256, and visible pixels before generation.
    missing_reference: BLOCKED

principles:
  - one_canonical_content_pipeline
  - narrative_design_precedes_scene_dialogue
  - locked_scene_precedes_visual_planning
  - cg_manifest_is_renderer_boundary
  - render_prompt_is_deterministic_projection
  - adapters_change_transport_not_creative_content
  - harness_logic_is_separate_from_content_data
  - repository_current_state_beats_conversation_memory
  - bounded_context_only
  - one_worker_one_task
  - parent_control_plane_only
  - continuity_in_canonical_artifacts_not_worker_memory
  - dependency_dag_and_provenance_invalidation
  - explicit_handoff
  - no_implicit_cross_character_memory
  - one_independent_image_per_generation_call
  - source_acquisition_is_fail_closed
  - cost_aware_model_routing
  - no_automatic_retry_or_image_scoring

pipeline:
  - layer: narrative_design
    harness: content_writer
    pass: narrative_design
    output: narrative_continuity_contract
  - layer: scene_dialogue
    harness: content_writer
    pass: scene_dialogue
    requires: approved_narrative_continuity_contract
    output: locked_scene
  - layer: narrative_review
    harness: content_qa
    pass: narrative_review
    output: approved_locked_scene
  - layer: visual_production
    harness: cg_planner
    requires: approved_locked_scene
    output: canonical_cg_manifest
  - layer: render
    harness: cg_renderer
    requires: canonical_cg_manifest_entry_and_declared_references
    output: cg_candidate
  - layer: visual_review
    harness: content_qa
    pass: visual_review
    output: accepted_or_rejected_candidate
  - layer: integration
    harness: integrator
    requires: accepted_content_and_assets
    output: playable_content

source_authority:
  policy: .ai/policies/SOURCE_AUTHORITY.md
  context_isolation: .ai/policies/CONTEXT_ISOLATION.md
  inventory: docs/CONTENT_PRODUCTION_SOURCE_MAP.md
  current_state: PROJECT_STATE.md
  narrative_canon:
    - docs/narrative/CONTENT_PRODUCTION_SPEC.md
    - docs/narrative/PROTOTYPE_BRAIDED_NARRATIVE_SPEC.md
    - docs/narrative/PROTOTYPE_ROUTE_GRAPH_AND_STATE.md
    - docs/narrative/route-blueprints/
    - docs/narrative/scenes/vertical-slice/
  visual_canon:
    - docs/art/PRODUCTION_VISUAL_DIRECTION.md
    - docs/art/CHARACTER_REFERENCE_PACK_SPEC.md
    - docs/art/CG_PRODUCTION_SPEC.md
  runtime_architecture:
    - ARCHITECTURE.zh-TW.md
  forbidden_source_roots:
    - .ai/archive/
    - .ai/experiments/
    - docs/archive/
  runtime_fixtures_not_production_guidance:
    - assets-src/characters/
    - content/routes/xu-tang/

harnesses:
  content_writer:
    path: .ai/harnesses/content-writer.md
    passes: [narrative_design, scene_dialogue]
  cg_planner:
    path: .ai/harnesses/cg-planner.md
    output: canonical_cg_manifest
  cg_renderer:
    path: .ai/harnesses/cg-renderer.md
    input_boundary: cg_manifest_entry_plus_references
  content_qa:
    path: .ai/harnesses/content-qa.md
    passes: [narrative_review, visual_review]
  integrator:
    path: .ai/harnesses/integrator.md
    input_boundary: accepted_outputs_only

schemas:
  task_packet: .ai/schemas/TASK_PACKET.md
  production_run_ledger: .ai/schemas/PRODUCTION_RUN_LEDGER.md
  data_packs: .ai/schemas/DATA_PACKS.md
  handoff: .ai/schemas/HANDOFF.md
  narrative_continuity: .ai/schemas/NARRATIVE_CONTINUITY.md
  narrative_continuity_json: .ai/schemas/narrative-continuity.schema.json
  visual_continuity: .ai/schemas/VISUAL_CONTINUITY.md
  cg_manifest: .ai/schemas/CG_MANIFEST.md
  cg_manifest_json: .ai/schemas/cg-manifest.schema.json

production_artifacts:
  narrative_contracts: content/production/narrative/
  cg_manifests: content/production/cg-manifests/
  validation: tools/validate-production-contracts.mjs

render_projection:
  tool: tools/render-cg-packets.mjs
  adapters: [chat_manual, work_batch, api]
  shared_prompt_must_match: true
  free_summary_allowed: false

execution:
  orchestration_contract: .ai/PRODUCTION_ORCHESTRATION.md
  parent_role: production_coordinator_control_plane_only
  default_unit: one_task
  default_agent_state: fresh
  each_independent_task_requires_fresh_worker: true
  worker_conversation_inheritance: forbidden
  worker_may_expand_scope: false
  worker_may_change_canon: false
  render_generation_unit: one_manifest_entry
  render_task_unit: one_independent_manifest_entry_or_explicit_linked_sequence
  parallelism: dependency_independent_only
  model_routing:
    default_tier: economical
    allowed_tiers: [economical, capable]
    coordinator_if_runtime_selectable: capable
    baseline_workloads:
      narrative_design: capable
      scene_dialogue: capable
      cg_plan: capable
      cross_scene_continuity_review: capable
      final_high_impact_qa: capable
      narrative_review: economical
      manifest_usability_review: economical
      cg_render_orchestration: economical
      visual_review: economical
      integrate: economical
      source_extraction: economical
      character_environment_spec_extraction: economical
      deterministic_prompt_compilation: economical
      filename_manifest_inventory: economical
      schema_transformation: economical
      bounded_checklist_validation: economical
      runtime_wiring: economical
    capable_reasons:
      - creative_judgment
      - material_ambiguity_or_conflict
      - cross_scene_or_cross_system_reasoning
      - final_high_impact_qa
      - validation_escalation
    prohibited_escalation_reasons:
      - task_importance_alone
      - source_count_alone
      - output_length_alone
    coordinator_corrective_redispatch_limit: 1
    renderer_automatic_retry: false
  run_ledger_root: content/production/runs/
  final_gate: READY_FOR_HUMAN_ACCEPTANCE
  human_gates:
    - major_story_direction
    - canonical_character_design
    - accepted_master_image_selection
    - final_playable_acceptance
