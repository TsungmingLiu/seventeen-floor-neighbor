workflow:
  id: seventeen-floor-production
  version: 0.4.1
  updated: 2026-09-25
  entrypoint: .ai/harnesses/bootstrap.md
  repository:
    full_name: TsungmingLiu/seventeen-floor-neighbor
    url: https://github.com/TsungmingLiu/seventeen-floor-neighbor
    canonical_branch: main
  drive_bindings:
    runtime_public_root:
      folder_id: 1bZAb9Fzj-xzFvklYCDNG60SJLuA-28Xn
      url: https://drive.google.com/drive/folders/1bZAb9Fzj-xzFvklYCDNG60SJLuA-28Xn
    runtime_public_bg:
      folder_id: 1GfEhIO-roX_4BWfAB0_wp3_zMDXmoES9
      url: https://drive.google.com/drive/folders/1GfEhIO-roX_4BWfAB0_wp3_zMDXmoES9
    source_private:
      folder_id: 1waCTQsIbfyZi0F80LlnWeerPcoNlPnw1
      url: https://drive.google.com/drive/folders/1waCTQsIbfyZi0F80LlnWeerPcoNlPnw1
    pilot_candidates:
      folder_id: 1-KdOiPN-6tEHZO3f2_-psM1kvfw7wf-M
      url: https://drive.google.com/drive/folders/1-KdOiPN-6tEHZO3f2_-psM1kvfw7wf-M

principles:
  - harness_logic_is_separate_from_content_data
  - repository_current_state_beats_conversation_memory
  - bounded_context_only
  - one_worker_one_task
  - explicit_handoff
  - no_implicit_cross_character_memory
  - no_batch_image_generation_across_unrelated_shots
  - one_independent_image_per_generation_call
  - batch_planning_allowed_but_batch_image_generation_forbidden
  - source_acquisition_is_fail_closed
  - metadata_success_is_not_visual_input_success
  - autonomous_connector_to_image_reference_binding_is_not_supported
  - base_cg_reference_transport_uses_human_attachment_gate
  - reaction_variants_prefer_edit_from_accepted_base

current_visual_direction:
  authority: docs/art/PRODUCTION_VISUAL_DIRECTION.md
  production_mode: cg_first
  new_character_sprites: false
  master_aspect_ratio: "16:9"
  mobile_target: landscape
  desktop_target: responsive_full_viewport
  ordinary_motion: cg_sequence
  cinematic_video: supported_but_reserved_for_special_events
  base_cg_reference_transport: human_attachment_required
  reaction_cg_transport: edit_from_accepted_base_preferred

source_authority:
  policy: .ai/policies/SOURCE_AUTHORITY.md
  context_isolation: .ai/policies/CONTEXT_ISOLATION.md
  inventory: docs/CONTENT_PRODUCTION_SOURCE_MAP.md
  highest_current_state:
    - PROJECT_STATE.md
    - .ai/WORKFLOW_MANIFEST.yaml
  runtime_architecture:
    - ARCHITECTURE.zh-TW.md
    - docs/W4_PLAYER_UI_MEMORIES_GALLERY_SPEC.md
  narrative_canon:
    - docs/narrative/PROTOTYPE_BRAIDED_NARRATIVE_SPEC.md
    - docs/narrative/PROTOTYPE_ROUTE_GRAPH_AND_STATE.md
    - docs/narrative/scenes/vertical-slice/
  visual_canon:
    - docs/art/PRODUCTION_VISUAL_DIRECTION.md
    - docs/art/CHARACTER_REFERENCE_PACK_SPEC.md
  progress_trackers:
    - TODO.md
    - docs/narrative/CONTENT_PRODUCTION_TODO.md
  forbidden_source_roots:
    - .ai/archive/
    - .ai/experiments/
    - docs/archive/
  runtime_fixtures_not_production_guidance:
    - runtime-public/sprites/
    - assets-src/characters/

harnesses:
  production_coordinator:
    path: .ai/harnesses/production-coordinator.md
    role: decompose high-level work and dispatch bounded tasks
  narrative_planner:
    path: .ai/harnesses/narrative-planner.md
    role: plan route/arc/scene objectives and state contracts
  scene_writer:
    path: .ai/harnesses/scene-writer.md
    role: write one bounded production scene
  shot_planner:
    path: .ai/harnesses/shot-planner.md
    role: convert locked scene intent into CG-first shots
  cg_artist:
    path: .ai/harnesses/cg-artist.md
    role: produce one image task or one tightly related CG sequence
  asset_qa:
    path: .ai/harnesses/asset-qa.md
    role: accept reject or request regeneration against explicit inputs
  integrator:
    path: .ai/harnesses/integrator.md
    role: wire accepted content and assets into runtime contracts

schemas:
  task_packet: .ai/schemas/TASK_PACKET.md
  data_packs: .ai/schemas/DATA_PACKS.md
  handoff: .ai/schemas/HANDOFF.md

execution:
  default_unit: one_task
  default_agent_state: fresh
  read_whole_repo: forbidden_unless_coordinator_explicitly_authorizes
  worker_may_expand_scope: false
  worker_may_change_canon: false
  human_gates:
    - base_cg_reference_attachment
    - major_story_direction
    - canonical_character_design
    - accepted_master_image_selection
    - final_playable_acceptance
