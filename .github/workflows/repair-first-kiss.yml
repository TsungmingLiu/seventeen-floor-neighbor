name: Repair First Kiss Cinematic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-first-kiss.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Download canonical keyframes
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-kiss-frames
          curl -fL --retry 3 "https://drive.google.com/uc?export=download&id=15gzAlAUCf4jgyQHJwDNPqFASB-Q7L3mL" -o /tmp/first-kiss-frames/01.png
          curl -fL --retry 3 "https://drive.google.com/uc?export=download&id=1yu21lSThoOp0WwW0IbNixmfc8DZh7GnE" -o /tmp/first-kiss-frames/02.png
          curl -fL --retry 3 "https://drive.google.com/uc?export=download&id=1QDl9QvR8PV-Mw2ib4MWjxwvJy3PWb3vL" -o /tmp/first-kiss-frames/03.png
          curl -fL --retry 3 "https://drive.google.com/uc?export=download&id=1JEHLfRPHyOrfDluheJRjTPaYJBMX_ay_" -o /tmp/first-kiss-frames/04.png
          for f in /tmp/first-kiss-frames/*.png; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt -of default=nw=1 "$f"
          done

      - name: Rebuild portable 10-second MP4 and WebM
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-kiss-rebuilt
          FILTER='[0:v]scale=1280:720:flags=lanczos,setsar=1,format=yuv420p[v0];[1:v]scale=1280:720:flags=lanczos,setsar=1,format=yuv420p[v1];[2:v]scale=1280:720:flags=lanczos,setsar=1,format=yuv420p[v2];[3:v]scale=1280:720:flags=lanczos,setsar=1,format=yuv420p[v3];[v0][v1]xfade=transition=fade:duration=0.666667:offset=2.333333[x1];[x1][v2]xfade=transition=fade:duration=0.666667:offset=4.666666[x2];[x2][v3]xfade=transition=fade:duration=0.666667:offset=7.000000,fade=t=out:st=9.45:d=0.55[v];[4:a]highpass=f=180,lowpass=f=6500,volume=0.10,afade=t=in:st=0:d=0.5,afade=t=out:st=9.45:d=0.55[a]'
          COMMON=(-loop 1 -framerate 24 -t 3 -i /tmp/first-kiss-frames/01.png -loop 1 -framerate 24 -t 3 -i /tmp/first-kiss-frames/02.png -loop 1 -framerate 24 -t 3 -i /tmp/first-kiss-frames/03.png -loop 1 -framerate 24 -t 3 -i /tmp/first-kiss-frames/04.png -f lavfi -t 10 -i 'anoisesrc=color=pink:amplitude=0.015:sample_rate=48000')

          ffmpeg -hide_banner -loglevel warning -y "${COMMON[@]}" -filter_complex "$FILTER" \
            -map '[v]' -map '[a]' -t 10 -r 24 \
            -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -profile:v high -level 4.0 \
            -movflags +faststart -c:a aac -b:a 96k \
            /tmp/first-kiss-rebuilt/mv-first-kiss.mp4

          ffmpeg -hide_banner -loglevel warning -y "${COMMON[@]}" -filter_complex "$FILTER" \
            -map '[v]' -map '[a]' -t 10 -r 24 \
            -c:v libvpx-vp9 -row-mt 1 -cpu-used 2 -crf 30 -b:v 0 -pix_fmt yuv420p \
            -c:a libopus -b:a 80k \
            /tmp/first-kiss-rebuilt/mv-first-kiss.webm

          for f in /tmp/first-kiss-rebuilt/*; do
            ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,pix_fmt,r_frame_rate -show_entries format=duration,size -of json "$f"
            ffmpeg -v error -i "$f" -f null -
          done

          mv /tmp/first-kiss-rebuilt/mv-first-kiss.mp4 assets-src/video/mv-first-kiss.mp4
          mv /tmp/first-kiss-rebuilt/mv-first-kiss.webm assets-src/video/mv-first-kiss.webm

      - name: Verify exact project devcontainer compatibility
        run: |
          set -euo pipefail
          docker build -f .devcontainer/Dockerfile -t seventeen-floor-neighbor-dev .devcontainer
          docker run --rm -v "$PWD:/work:ro" seventeen-floor-neighbor-dev sh -lc '
            set -e
            ffmpeg -version | head -1
            ffmpeg -v error -i /work/assets-src/video/mv-first-kiss.mp4 -f null -
            ffmpeg -v error -i /work/assets-src/video/mv-first-kiss.webm -f null -
          '

      - name: Verify project asset contract
        run: |
          set -euo pipefail
          npm run assets:check
          npm run assets:build
          npm run build
          npm run validate
          npm test
          git diff --check

      - name: Commit repaired cinematic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-src/video/mv-first-kiss.mp4 assets-src/video/mv-first-kiss.webm
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "fix: rebuild first-kiss cinematic from canonical keyframes"
            git fetch origin main
            git rebase origin/main
            npm run assets:check
            npm run build
            npm run validate
            npm test
            git diff --check
            git push origin HEAD:main
          fi

      - name: Clean stale W3 acceptance Codespaces
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          set -euo pipefail
          gh codespace list -R "$GITHUB_REPOSITORY" --json name,displayName \
            --jq '.[] | select(.displayName | startswith("w3-ai-")) | .name' \
            | while read -r name; do
                [ -n "$name" ] || continue
                echo "Deleting stale acceptance Codespace: $name"
                gh codespace delete -c "$name" -f
              done

      - name: Run fresh Codespace acceptance on repaired main
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: npm run codespace:accept -- --repo "$GITHUB_REPOSITORY" --branch main
