name: Repair First Kiss Cinematic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-first-kiss.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect source cinematic
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,pix_fmt -show_entries format=duration -of json assets-src/video/mv-first-kiss.mp4
          ffmpeg -v error -i assets-src/video/mv-first-kiss.mp4 -f null -
          ffmpeg -v error -i assets-src/video/mv-first-kiss.webm -f null -

      - name: Re-encode portable MP4 and WebM
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-kiss-repair
          ffmpeg -y -i assets-src/video/mv-first-kiss.mp4 \
            -map 0:v:0 -map '0:a?' \
            -t 10 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -movflags +faststart \
            -c:a aac -b:a 128k -ar 48000 \
            /tmp/first-kiss-repair/mv-first-kiss.mp4
          ffmpeg -y -i assets-src/video/mv-first-kiss.mp4 \
            -map 0:v:0 -map '0:a?' \
            -t 10 \
            -c:v libvpx-vp9 -row-mt 1 -crf 32 -b:v 0 -pix_fmt yuv420p \
            -c:a libopus -b:a 96k -ar 48000 \
            /tmp/first-kiss-repair/mv-first-kiss.webm
          ffmpeg -v error -i /tmp/first-kiss-repair/mv-first-kiss.mp4 -f null -
          ffmpeg -v error -i /tmp/first-kiss-repair/mv-first-kiss.webm -f null -
          mv /tmp/first-kiss-repair/mv-first-kiss.mp4 assets-src/video/mv-first-kiss.mp4
          mv /tmp/first-kiss-repair/mv-first-kiss.webm assets-src/video/mv-first-kiss.webm

      - name: Verify exact project devcontainer compatibility
        run: |
          set -euo pipefail
          docker build -f .devcontainer/Dockerfile -t seventeen-floor-neighbor-dev .devcontainer
          docker run --rm -v "$PWD:/work:ro" seventeen-floor-neighbor-dev sh -lc '
            set -e
            ffmpeg -version | head -1
            ffmpeg -v error -i /work/assets-src/video/mv-first-kiss.mp4 -f null -
            ffmpeg -v error -i /work/assets-src/video/mv-first-kiss.webm -f null -
          '

      - name: Verify project asset contract
        run: |
          set -euo pipefail
          npm run assets:check
          npm run assets:build
          npm run build
          npm run validate
          npm test
          git diff --check

      - name: Commit repaired cinematic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-src/video/mv-first-kiss.mp4 assets-src/video/mv-first-kiss.webm
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "fix: normalize first-kiss cinematic encodings"
            git push origin HEAD:main
          fi

      - name: Clean stale W3 acceptance Codespaces
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          set -euo pipefail
          gh codespace list -R "$GITHUB_REPOSITORY" --json name,displayName \
            --jq '.[] | select(.displayName | startswith("w3-ai-")) | .name' \
            | while read -r name; do
                [ -n "$name" ] || continue
                echo "Deleting stale acceptance Codespace: $name"
                gh codespace delete -c "$name" -f
              done

      - name: Run fresh Codespace acceptance on repaired main
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: npm run codespace:accept -- --repo "$GITHUB_REPOSITORY" --branch main
