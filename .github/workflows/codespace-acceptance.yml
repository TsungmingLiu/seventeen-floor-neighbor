name: Codespace Acceptance

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch/ref to validate in a fresh ephemeral Codespace
        required: true
        default: main
        type: string

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Codespaces token
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing repository secret CODESPACES_TOKEN."
            echo "Create a fine-grained token scoped to this repository with Codespaces: read/write and Codespaces metadata: read, then save it as Actions secret CODESPACES_TOKEN."
            exit 1
          fi
          gh auth status
      - name: Verify Codespaces token permissions
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/codespaces/devcontainers" --silent; then
            echo "::error::CODESPACES_TOKEN cannot read Codespaces metadata for this repository."
            echo "Edit the fine-grained PAT and grant: Codespaces = Read and write; Codespaces metadata = Read-only."
            exit 1
          fi
      - name: Run AI-operated fresh Codespace acceptance
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: npm run codespace:accept -- --repo "$GITHUB_REPOSITORY" --branch "${{ inputs.branch }}"
