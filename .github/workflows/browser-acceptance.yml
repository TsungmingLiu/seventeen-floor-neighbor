name: Browser Acceptance

on:
  workflow_call:
    inputs:
      reuse_verified_artifact:
        description: Use the playable-game artifact produced by Verify in this exact run.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'assets-src/**'
      - 'tools/build*.mjs'
      - 'tools/preview-server.mjs'
      - 'tests/browser-acceptance.spec.mjs'
      - '.github/workflows/browser-acceptance.yml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Regression tests require pinned historical commits.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build clean browser runtime for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run assets:check
          npm run assets:build
          npm run build
          npm run validate
          npm test

      - name: Download same-run verified game
        if: inputs.reuse_verified_artifact
        uses: actions/download-artifact@v4
        with:
          name: playable-game
          path: dist/

      - name: Check verified runtime artifact
        if: inputs.reuse_verified_artifact
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/content/routes/index.json

      - name: Install transient Playwright runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Chromium acceptance
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node tools/preview-server.mjs --preview --skip-build --port 4173 > /tmp/browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/browser-preview.log' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Preview failed to become ready" >&2
              exit 1
            fi
            sleep 1
          done

          npx playwright test tests/browser-acceptance.spec.mjs --workers=1 --reporter=line
