name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Asset check
        run: npm run assets:check
      - name: Asset build
        run: npm run assets:build
      - name: Build
        run: npm run build
      - name: Preview server smoke
        run: npm run preview:smoke -- --skip-build
      - name: Validate
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Generated output is committed
        run: git diff --exit-code
