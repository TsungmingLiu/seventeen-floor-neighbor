name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Production Task Packets pin earlier source commits.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject tracked execution scratch
        run: npm run scratch:check
      - name: Install media validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Production source/artifact boundary
        run: npm run production:storage:check
      - name: Asset check
        run: npm run assets:check
      - name: Asset build
        run: npm run assets:build
      - name: Build
        run: npm run build
      - name: Preview server smoke
        run: npm run preview:smoke -- --skip-build
      - name: Codespace acceptance command dry-run
        run: npm run codespace:accept -- --dry-run
      - name: Validate
        run: npm run validate
      - name: Asset coverage report
        run: |
          npm run assets:coverage --silent > /tmp/asset-coverage.json
          node -e 'const r = require("/tmp/asset-coverage.json"); console.log(JSON.stringify({scope: r.scope, summary: r.summary}, null, 2))'
      - name: Tests
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Build leaves tracked sources unchanged
        run: git diff --exit-code
      - name: Save verified game for Pages
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: playable-game
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser_paths:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.filter.outputs.applicable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          if [ "$EVENT_NAME" = pull_request ]; then base="$BASE_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'applicable=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base...$SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(src/|public/|content/|assets-src/|tools/build[^/]*\.mjs$|tools/preview-server\.mjs$|tests/browser-acceptance\.spec\.mjs$|\.github/workflows/(browser-acceptance|verify)\.yml$)'; then
            echo 'applicable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
          fi

  browser_acceptance:
    needs: [verify, browser_paths]
    if: needs.browser_paths.outputs.applicable == 'true'
    uses: ./.github/workflows/browser-acceptance.yml
    with:
      reuse_verified_artifact: true

  deploy:
    name: Deploy Cloudflare Pages
    needs: verify
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified game
        uses: actions/download-artifact@v4
        with:
          name: playable-game
          path: dist/
      - name: Check Pages setup and static output
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as repository Actions secrets.'
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo '::error::Set CLOUDFLARE_PAGES_PROJECT to the existing Pages project name as a repository Actions variable.'
            exit 1
          fi
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/content/routes/index.json
          if [ -e dist/_worker.js ] || [ -d dist/functions ]; then
            echo '::error::Expected static Pages output, but found server-side code.'
            exit 1
          fi
      - name: Deploy verified game
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Show playable URL
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo '::error::Cloudflare returned no deployment URL.'
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ -z "$ALIAS_URL" ]; then
            echo '::error::Cloudflare returned no stable PR preview alias.'
            exit 1
          fi
          {
            echo '## Playable Cloudflare Pages deployment'
            echo
            echo "Commit URL: $DEPLOYMENT_URL"
            if [ -n "$ALIAS_URL" ]; then
              echo
              echo "Latest URL for this PR/branch: $ALIAS_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test deployed Pages site
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base_url="${DEPLOYMENT_URL%/}"
          route_id=$(node -p "JSON.parse(require('fs').readFileSync('dist/content/routes/index.json', 'utf8')).defaultRoute")
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "$base_url/" -o /tmp/pages-index.html
          grep -q '<base href="/">' /tmp/pages-index.html
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "$base_url/playable-review/" -o /tmp/pages-deep-link.html
          grep -q '<base href="/">' /tmp/pages-deep-link.html
          for file in \
            app.js \
            content/routes/index.json \
            "content/routes/$route_id/chapter.json" \
            "content/routes/$route_id/scenes.json" \
            "content/routes/$route_id/memories.json" \
            "content/routes/$route_id/assets.json" \
            assets/unavailable.svg; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "$base_url/$file" -o /tmp/pages-asset
            cmp "dist/$file" /tmp/pages-asset
          done
