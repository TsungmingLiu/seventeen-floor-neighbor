name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Generated output is committed
        run: git diff --exit-code
