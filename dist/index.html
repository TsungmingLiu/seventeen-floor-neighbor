<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="第一人稱互動戀愛喜劇 Demo">
  <title>17樓的新鄰居</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b10'/%3E%3Cpath d='M32 50S12 39 12 24c0-11 14-15 20-6 6-9 20-5 20 6 0 15-20 26-20 26Z' fill='%23ff6b8b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section class="title-screen" id="title-screen" aria-labelledby="game-title">
      <img class="title-art" id="title-art" alt="雨夜公寓走廊裡的新鄰居許棠">
      <div class="title-vignette"></div>
      <div class="title-copy">
        <p class="eyebrow">第一人稱互動戀愛喜劇</p>
        <h1 id="game-title"><span>17樓的</span>新鄰居</h1>
        <p class="premise">搬家第一晚，你把行李卡進消防門，還在停電的電梯裡遇見了住隔壁的她。</p>
        <div class="title-actions">
          <button class="primary-button" id="start-button" type="button" disabled>載入中…</button>
          <button class="text-button gallery-button" id="gallery-button" type="button">CG 收藏 <span id="gallery-title-count">0 / 16</span></button>
          <button class="text-button" id="title-mute" type="button" aria-pressed="false">聲音：開</button>
        </div>
      </div>
      <p class="title-hint">你的選擇會改變她對這位新鄰居的第一印象。</p>
    </section>

    <section class="gallery-screen is-hidden" id="gallery-screen" aria-labelledby="gallery-title">
      <div class="gallery-shell">
        <header class="gallery-header">
          <div>
            <p class="eyebrow">回憶收藏</p>
            <h2 id="gallery-title">CG 收藏</h2>
            <p class="gallery-progress" id="gallery-progress">已解鎖 0 / 16</p>
          </div>
          <button class="text-button" id="gallery-back" type="button">返回標題</button>
        </header>
        <div class="cg-grid" id="cg-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="game-shell is-hidden" id="game-shell" aria-label="遊戲畫面">
      <div class="stage" id="stage">
        <div class="visual-layer" aria-hidden="true">
          <img class="scene-image" id="scene-image" alt="">
          <div class="character-layer" id="character-layer"></div>
          <div class="fallback-scene"></div>
          <div class="cinematic-bars"></div>
          <div class="scene-flash" id="scene-flash"></div>
          <div class="scene-vignette"></div>
        </div>
        <header class="game-hud" id="game-hud">
          <div class="chapter-track" id="chapter-track" aria-label="故事進度"></div>
          <div class="hud-actions">
            <button class="icon-button" id="mute-button" type="button" aria-pressed="false" aria-label="切換聲音">♪</button>
            <button class="icon-button" id="restart-button" type="button" aria-label="從頭開始">↻</button>
          </div>
        </header>
        <section class="dialogue-panel" id="dialogue-panel" aria-live="polite">
          <div class="moment-card is-hidden" id="moment-card" role="status"></div>
          <div class="speaker-row">
            <span class="speaker" id="speaker">旁白</span>
            <span class="advance-hint" id="advance-hint">點擊繼續</span>
          </div>
          <p class="dialogue-text" id="dialogue-text"></p>
          <div class="choice-list is-hidden" id="choice-list" aria-label="選擇回應"></div>
        </section>
        <button class="advance-zone" id="advance-zone" type="button" aria-label="繼續劇情"></button>
      </div>
    </section>

    <section class="ending-screen is-hidden" id="ending-screen" aria-live="polite">
      <img class="ending-art" id="ending-art" alt="許棠站在隔壁房門前">
      <div class="ending-vignette"></div>
      <div class="ending-copy">
        <p class="eyebrow">本次結局</p>
        <h2 id="ending-title"></h2>
        <p id="ending-text"></p>
        <p class="ending-count" id="ending-count"></p>
        <div class="ending-actions">
          <button class="primary-button" id="replay-button" type="button">換個選擇</button>
          <button class="text-button" id="home-button" type="button">回到標題</button>
        </div>
      </div>
    </section>

    <dialog class="cg-viewer" id="cg-viewer" aria-labelledby="cg-viewer-title">
      <div class="cg-viewer-shell">
        <header class="cg-viewer-header">
          <div>
            <p class="cg-viewer-chapter" id="cg-viewer-chapter"></p>
            <h2 id="cg-viewer-title"></h2>
          </div>
          <button class="icon-button viewer-close" id="cg-viewer-close" type="button" aria-label="關閉 CG">×</button>
        </header>
        <div class="cg-viewer-canvas">
          <img id="cg-viewer-image" alt="">
        </div>
        <footer class="cg-viewer-controls">
          <button class="text-button" id="cg-viewer-prev" type="button">上一張</button>
          <span id="cg-viewer-position"></span>
          <button class="text-button" id="cg-viewer-next" type="button">下一張</button>
        </footer>
      </div>
    </dialog>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
